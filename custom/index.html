<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오</title>
  <!-- /portfolio-custom (직접 생성 모드) · 2026-11-23
       배치: theme/layout.json — 왼쪽 단 고정(이름·한 줄 정체성·절 이동·연락처) + 오른쪽 단 스크롤(줄마다 나뉜 목록)
       색: 디자인 요청 — 바탕 #1A1B1F · 카드 #25262B · 글자 #F7F8F8 · 강조 #7170FF · 영문 Inter · 카드 12px · 버튼 8px · 그림 칸 조금 크게(24:76 → 36:64)
       내용은 ../data/*.json을 실행 중에 읽습니다(/portfolio-build만 다시 하면 이 페이지도 최신). UI 문구는 ../theme/strings.tsv(문구 표)를 따릅니다. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/latin-700.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/latin-800.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        screens: { sm: '760px', lg: '1024px', xl: '1280px' },
        extend: {
          colors: {
            bg: '#1A1B1F', surface: '#25262B', ink: '#F7F8F8', body: '#D0D6E0', muted: '#9AA0A9',
            line: '#2D2E32', line2: '#3B3C41', accent: '#7170FF', 'accent-ink': '#A3A2FF',
          },
          fontFamily: {
            sans: ['Pretendard', 'system-ui', 'sans-serif'],
            en: ['Inter', 'Pretendard', 'system-ui', 'sans-serif'],
          },
          borderRadius: { card: '12px', btn: '8px' },
        },
      },
    };
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body { background: #1A1B1F; color: #D0D6E0; }
    ::selection { background: rgba(113, 112, 255, .35); color: #F7F8F8; }
    .glow { background: radial-gradient(600px circle at 15% 0%, rgba(113, 112, 255, .10), transparent 60%); }
    code.inline { font-family: 'D2Coding', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em;
      background: #2D2E32; color: #F7F8F8; padding: .1em .35em; border-radius: 4px; }
    .nav-line { transition: width .2s ease, background-color .2s ease; }
    a:focus-visible, button:focus-visible { outline: 2px solid #A3A2FF; outline-offset: 2px; border-radius: 8px; }
  </style>
</head>
<body class="font-sans antialiased">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="../assets/strings.js"></script>

  <script type="text/babel" data-presets="react">
    const { useEffect, useState } = React;

    // ── 문구 표(theme/strings.tsv) — 내 문구가 있으면 그것, 없으면 기본 문구 ──
    // assets/strings.js의 PFStr는 전역 const라 window.PFStr로는 보이지 않음 → typeof로 확인
    const hasStr = typeof PFStr !== 'undefined';
    const t = (k, vars) => (hasStr ? PFStr.t(k, vars) : k);

    // ── 도움 함수 ──
    const img = (id, src) => `../src/${id}/${src}`;
    const deckUrl = (id) => `../project.html?p=${encodeURIComponent(id)}`;
    const docUrl = (id) => `../doc.html?p=${encodeURIComponent(id)}`;
    const pad2 = (n) => String(n).padStart(2, '0');
    const normTitle = (s) => String(s || '').replace(/[`*_~]/g, '').replace(/\s+/g, ' ').trim();
    const keyOk = (k) => /^[a-z][a-z0-9-]{1,31}$/.test(k || '') && !/^s-\d+$/.test(k);
    // 기능의 절 제목 → 슬라이드 장면 주소(포트폴리오 페이지의 [슬라이드 열기]와 같은 규칙)
    function sceneFor(p, section) {
      const want = normTitle(section);
      const slides = (p.deck && p.deck.slides) || [];
      if (!want || !slides.length) return '';
      const last = (x) => normTitle((x.sectionPath || []).slice(-1)[0]);
      const sl = slides.find((x) => last(x) === want) || slides.find((x) => (x.sectionPath || []).some((s) => normTitle(s) === want));
      return sl && keyOk(sl.key) ? `#s=d-${sl.key}` : '';
    }
    // `코드` 조각만 코드 글자로 — 나머지는 글자 그대로
    function Rich({ text }) {
      const parts = String(text || '').split(/(`[^`]+`)/g);
      return parts.map((s, i) => (s.startsWith('`') && s.endsWith('`') && s.length > 2
        ? <code key={i} className="inline">{s.slice(1, -1)}</code> : <React.Fragment key={i}>{s}</React.Fragment>));
    }
    const ext = { target: '_blank', rel: 'noopener noreferrer' };
    const Arrow = () => <span aria-hidden="true" className="ml-1 inline-block transition-transform group-hover:-translate-y-0.5 group-hover:translate-x-0.5">↗</span>;

    function Btn({ href, children, primary, external }) {
      if (!href) return null;
      const base = 'group inline-flex items-center rounded-btn px-3.5 py-2 text-sm font-semibold transition-colors';
      const cls = primary ? `${base} bg-accent text-white hover:bg-[#8584FF]` : `${base} border border-line2 text-ink hover:border-accent hover:text-accent-ink`;
      return <a href={href} className={cls} {...(external ? ext : {})}>{children}{external && <Arrow />}</a>;
    }
    const Eyebrow = ({ children }) => <p className="font-en text-xs font-bold uppercase tracking-[0.18em] text-accent-ink">{children}</p>;
    function SectionHead({ en, ko, note }) {
      return (
        <div className="mb-8 lg:mb-10">
          <Eyebrow>{en}</Eyebrow>
          <div className="mt-2 flex items-baseline justify-between gap-4">
            <h2 className="text-2xl font-bold text-ink">{ko}</h2>
            {note && <span className="text-sm text-muted">{note}</span>}
          </div>
        </div>
      );
    }
    const Tags = ({ tags }) => (tags && tags.length ? (
      <ul className="mt-4 flex flex-wrap gap-2">
        {tags.map((x) => <li key={x} className="rounded-full bg-accent/10 px-3 py-1 text-xs font-medium text-accent-ink">{x}</li>)}
      </ul>) : null);

    // ── 왼쪽 단(고정) — 머리 ──
    function Header({ profile, generatedAt, active }) {
      const nav = [
        ['intro', t('page.nav-intro')], ['stack', t('page.nav-stack')], ['projects', t('page.nav-projects')],
        ['glance', t('page.nav-glance')], ['contact', t('page.nav-contact')],
      ];
      return (
        <header id="cover" className="pt-16 pb-4 lg:sticky lg:top-0 lg:flex lg:h-screen lg:w-[48%] lg:flex-col lg:justify-between lg:py-24">
          <div>
            <Eyebrow>{t('en.portfolio')}</Eyebrow>
            <h1 className="mt-3 text-4xl font-bold tracking-tight text-ink sm:text-5xl">{profile.name}</h1>
            {profile.nameEn && <p className="mt-2 font-en text-lg font-bold text-accent-ink">{profile.nameEn}</p>}
            {profile.headline && <p className="mt-4 max-w-sm text-lg leading-relaxed text-body">{profile.headline}</p>}
            <nav className="mt-16 hidden lg:block" aria-label={t('name.toc')}>
              <ul className="space-y-1">
                {nav.map(([id, label]) => (
                  <li key={id}>
                    <a href={`#${id}`} className="group flex items-center gap-4 py-2">
                      <span className={`nav-line h-px ${active === id ? 'w-16 bg-ink' : 'w-8 bg-muted group-hover:w-16 group-hover:bg-ink'}`} />
                      <span className={`text-xs font-bold tracking-wide ${active === id ? 'text-ink' : 'text-muted group-hover:text-ink'}`}>{label}</span>
                    </a>
                  </li>
                ))}
              </ul>
            </nav>
          </div>
          <div className="mt-8 lg:mt-0">
            <div className="flex flex-wrap gap-2">
              {profile.email && <Btn href={`mailto:${profile.email}`} primary>{profile.email}</Btn>}
              <Btn href={profile.github} external>GitHub</Btn>
              {(profile.links || []).map((l) => <Btn key={l.url} href={l.url} external>{l.label}</Btn>)}
            </div>
            {generatedAt && <p className="mt-6 text-xs text-muted">{t('page.updated', { date: generatedAt })}</p>}
          </div>
        </header>
      );
    }

    // ── 오른쪽 단 — 자기소개 ──
    function Intro({ profile }) {
      if (!profile.intro) return null;
      return (
        <section id="intro" className="scroll-mt-16 pb-20 lg:pb-28">
          <SectionHead en={t('en.about')} ko={t('page.intro')} />
          <p className="whitespace-pre-line text-lg leading-8 text-body">{profile.intro}</p>
        </section>
      );
    }

    // ── 기술 스택 — 줄마다 2단 24:76 (기술 | 어디에 썼는지 + 근거 프로젝트) ──
    function Stack({ skills, titles }) {
      if (!skills || !skills.length) return null;
      return (
        <section id="stack" className="scroll-mt-16 pb-20 lg:pb-28">
          <SectionHead en={t('en.skills')} ko={t('page.stack')} note={t('page.stack-note')} />
          <ol className="space-y-2">
            {skills.map((s) => (
              <li key={s.name} className="grid gap-3 rounded-card p-4 transition-colors hover:bg-surface sm:grid-cols-[minmax(0,24fr)_minmax(0,76fr)] sm:gap-6 sm:-mx-4">
                <h3 className="font-bold text-ink">{s.name}</h3>
                <ul className="space-y-3">
                  {(s.evidence || []).map((e, i) => (
                    <li key={i} className="leading-relaxed">
                      <span className="text-body"><Rich text={e.text} /></span>
                      {titles[e.project] && <a href={`#p-${e.project}`} className="ml-2 whitespace-nowrap text-sm text-accent-ink hover:underline">{titles[e.project]}</a>}
                    </li>
                  ))}
                </ul>
              </li>
            ))}
          </ol>
        </section>
      );
    }

    // ── 프로젝트 소개 — 2단 · 대표 이미지 왼쪽(36:64, 요청: 그림 칸 조금 크게) ──
    function ProjectIntro({ p, no, total }) {
      const links = p.links || {};
      const teamLabel = p.team && p.team.type === 'team' ? t('name.team') : t('name.solo');
      return (
        <article id={`p-${p.id}`} className="scroll-mt-16">
          <p className="font-en text-xs font-bold uppercase tracking-[0.18em] text-accent-ink">{t('page.project-no', { no: pad2(no), total: pad2(total) })}</p>
          <div className="mt-2 flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
            <h3 className="text-2xl font-bold text-ink">{p.title}</h3>
            <span className="text-sm text-muted">{teamLabel}{p.team && p.team.size ? ` · ${p.team.size}` : ''}</span>
          </div>
          {p.tagline && <p className="mt-2 leading-relaxed text-body">{p.tagline}</p>}

          <div className={`mt-6 grid gap-6 rounded-card border border-line bg-surface p-5 ${p.cover ? 'sm:grid-cols-[minmax(0,36fr)_minmax(0,64fr)]' : ''}`}>
            {p.cover && (
              <a href={deckUrl(p.id)} className="block self-start overflow-hidden rounded-btn border border-line">
                <img src={img(p.id, p.cover)} alt={`${p.title} 대표 이미지`} loading="lazy" className="aspect-video w-full object-cover transition-transform duration-300 hover:scale-[1.03]" />
              </a>
            )}
            <div className="min-w-0">
              {p.meta && p.meta.length > 0 && (
                <dl className="grid grid-cols-1 gap-x-6 gap-y-3 text-sm xl:grid-cols-2">
                  {p.meta.map((m) => (
                    <div key={m.label}>
                      <dt className="text-xs text-muted">{m.label}</dt>
                      <dd className="mt-0.5 text-ink">{m.value}</dd>
                    </div>
                  ))}
                </dl>
              )}
              {p.team && p.team.role && (
                <div className="mt-4 text-sm">
                  <p className="text-xs text-muted">{t('name.role')}</p>
                  <p className="mt-0.5 text-ink">{p.team.role}</p>
                </div>
              )}
            </div>
          </div>

          {p.intent && p.intent.text && (
            <div className="mt-5 border-l-2 border-accent pl-4">
              <p className="text-xs font-semibold text-accent-ink">{t('name.intent')}</p>
              <p className="mt-1 leading-relaxed text-body"><Rich text={p.intent.text} /></p>
            </div>
          )}
          <Tags tags={p.tags} />
          <div className="mt-5 flex flex-wrap gap-2">
            <Btn href={deckUrl(p.id)} primary>{t('name.deck')}</Btn>
            <Btn href={docUrl(p.id)}>{t('name.doc-short')}</Btn>
            <Btn href={links.github} external>GitHub</Btn>
            <Btn href={links.video} external>{t('name.video')}</Btn>
            {(links.extra || []).map((l) => <Btn key={l.url} href={l.url} external>{l.label}</Btn>)}
          </div>
        </article>
      );
    }

    // ── 기능 소개 — 줄마다 2단 · 기능 화면 왼쪽(36:64). 화면이 없는 기능은 글이 폭 전체 ──
    function Features({ p }) {
      const hl = p.highlights || [];
      if (!hl.length) return null;
      return (
        <div id={`p-${p.id}-core`} className="mt-12 scroll-mt-16">
          <div className="mb-5 flex items-baseline justify-between gap-4">
            <h4 className="text-lg font-bold text-ink">{t('page.features')}</h4>
            <a href={deckUrl(p.id)} className="text-sm text-accent-ink hover:underline">{t('page.deck-all')}</a>
          </div>
          <ol className="space-y-2">
            {hl.map((h, i) => {
              const scene = sceneFor(p, h.section);
              const hasImg = h.image && h.image.src;
              return (
                <li key={i} className={`grid gap-4 rounded-card p-4 transition-colors hover:bg-surface sm:gap-6 sm:-mx-4 ${hasImg ? 'sm:grid-cols-[minmax(0,36fr)_minmax(0,64fr)]' : ''}`}>
                  {hasImg && (
                    <figure className="self-start">
                      <img src={img(p.id, h.image.src)} alt={h.image.caption || h.title} loading="lazy"
                        {...(h.image.w && h.image.h ? { width: h.image.w, height: h.image.h } : {})}
                        className="h-auto w-full rounded-btn border border-line bg-bg" />
                    </figure>
                  )}
                  <div className="min-w-0">
                    <p className="font-en text-xs font-bold uppercase tracking-[0.18em] text-muted">{t('en.feature')} {pad2(i + 1)}</p>
                    <h5 className="mt-1 font-bold text-ink"><Rich text={h.title} /></h5>
                    {h.what && <p className="mt-2 text-sm leading-relaxed text-body"><Rich text={h.what} /></p>}
                    {h.how && <p className="mt-2 text-sm leading-relaxed text-muted"><Rich text={h.how} /></p>}
                    <a href={`${deckUrl(p.id)}${scene}`} className="mt-3 inline-block text-sm font-semibold text-accent-ink hover:underline">{t('page.see-in-deck')} →</a>
                  </div>
                </li>
              );
            })}
          </ol>
        </div>
      );
    }

    // ── 한눈에 보기 — 줄마다 2단 · 대표 이미지 왼쪽 · 낮은 줄 ──
    function Glance({ projects }) {
      return (
        <section id="glance" className="scroll-mt-16 pb-20 lg:pb-28">
          <SectionHead en={t('en.glance')} ko={t('page.glance')} />
          <ul className="space-y-2">
            {projects.map((p) => (
              <li key={p.id} className={`grid gap-4 rounded-card p-4 transition-colors hover:bg-surface sm:gap-6 sm:-mx-4 ${p.cover ? 'sm:grid-cols-[minmax(0,28fr)_minmax(0,72fr)]' : ''}`}>
                {p.cover && <a href={`#p-${p.id}`} className="block self-start overflow-hidden rounded-btn border border-line"><img src={img(p.id, p.cover)} alt="" loading="lazy" className="aspect-video w-full object-cover" /></a>}
                <div className="min-w-0">
                  <a href={`#p-${p.id}`} className="font-bold text-ink hover:text-accent-ink">{p.title}</a>
                  {p.tagline && <p className="mt-1 text-sm leading-relaxed text-body">{p.tagline}</p>}
                  <p className="mt-2 text-xs text-muted">
                    {t('name.role-short')} · {p.team && p.team.role ? p.team.role : (p.team && p.team.type === 'team' ? t('name.team') : t('name.solo'))}
                  </p>
                  {p.tags && p.tags.length > 0 && <p className="mt-1 text-xs text-muted">{p.tags.slice(0, 4).join(' · ')}</p>}
                </div>
              </li>
            ))}
          </ul>
        </section>
      );
    }

    // ── 연락처 — 작은 글자 한 단 ──
    function Contact({ profile, projects }) {
      return (
        <footer id="contact" className="scroll-mt-16 border-t border-line pt-10 pb-16 text-sm text-muted">
          <Eyebrow>{t('en.contact')}</Eyebrow>
          <div className="mt-4 flex flex-wrap gap-x-6 gap-y-2">
            {profile.email && <a href={`mailto:${profile.email}`} className="text-ink hover:text-accent-ink">{profile.email}</a>}
            {profile.github && <a href={profile.github} {...ext} className="text-ink hover:text-accent-ink">GitHub ↗</a>}
            {(profile.links || []).map((l) => <a key={l.url} href={l.url} {...ext} className="text-ink hover:text-accent-ink">{l.label} ↗</a>)}
          </div>
          <ul className="mt-6 space-y-1.5">
            {projects.map((p) => (
              <li key={p.id} className="flex flex-wrap gap-x-3">
                <span className="text-body">{p.title}</span>
                <a href={deckUrl(p.id)} className="hover:text-accent-ink">{t('name.deck')}</a>
                <a href={docUrl(p.id)} className="hover:text-accent-ink">{t('name.doc-short')}</a>
                {p.links && p.links.github && <a href={p.links.github} {...ext} className="hover:text-accent-ink">GitHub ↗</a>}
                {p.links && p.links.video && <a href={p.links.video} {...ext} className="hover:text-accent-ink">{t('name.video')} ↗</a>}
              </li>
            ))}
          </ul>
        </footer>
      );
    }

    // ── 지금 보고 있는 절(왼쪽 절 이동 표시) ──
    function useActive(ids, ready) {
      const [active, setActive] = useState(ids[0]);
      useEffect(() => {
        if (!ready) return;
        const els = ids.map((id) => document.getElementById(id)).filter(Boolean);
        const io = new IntersectionObserver((ents) => {
          const vis = ents.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
          if (vis[0]) setActive(vis[0].target.id);
        }, { rootMargin: '-30% 0px -60% 0px' });
        els.forEach((el) => io.observe(el));
        return () => io.disconnect();
      }, [ready]);
      return active;
    }

    function App() {
      const [state, setState] = useState({ status: 'loading' });
      useEffect(() => {
        (async () => {
          try {
            if (hasStr) await PFStr.load('../theme/strings.tsv');
            const res = await fetch('../data/portfolio.json', { cache: 'no-cache' });
            if (!res.ok) throw new Error(`data/portfolio.json (${res.status})`);
            const pf = await res.json();
            const projects = (await Promise.all((pf.projects || []).map(async (id) => {
              const r = await fetch(`../data/projects/${encodeURIComponent(id)}.json`, { cache: 'no-cache' });
              return r.ok ? r.json() : null;
            }))).filter(Boolean);
            document.title = `${pf.profile.name} · ${t('name.portfolio')}`;
            setState({ status: 'ok', pf, projects });
          } catch (e) {
            setState({ status: 'error', message: String(e && e.message || e) });
          }
        })();
      }, []);
      const active = useActive(['intro', 'stack', 'projects', 'glance', 'contact'], state.status === 'ok');

      if (state.status === 'loading') return <p className="p-10 text-muted">불러오는 중…</p>;
      if (state.status === 'error') return <p className="p-10 text-muted">데이터를 읽지 못했습니다: {state.message} — 로컬 서버로 열었는지, /portfolio-build를 했는지 확인하세요.</p>;

      const { pf, projects } = state;
      const titles = Object.fromEntries(projects.map((p) => [p.id, p.title]));
      return (
        <div className="glow min-h-screen">
          <div className="mx-auto max-w-[1248px] px-6 sm:px-8 lg:flex lg:justify-between lg:gap-8">
            <Header profile={pf.profile} generatedAt={pf.generatedAt} active={active} />
            <main className="pt-12 lg:w-[52%] lg:py-24">
              <Intro profile={pf.profile} />
              <Stack skills={pf.skills} titles={titles} />
              <section id="projects" className="scroll-mt-16 pb-20 lg:pb-28">
                <SectionHead en={t('en.project')} ko={t('page.nav-projects')} />
                <div className="space-y-24">
                  {projects.map((p, i) => (
                    <div key={p.id}>
                      <ProjectIntro p={p} no={i + 1} total={projects.length} />
                      <Features p={p} />
                    </div>
                  ))}
                </div>
              </section>
              <Glance projects={projects} />
              <Contact profile={pf.profile} projects={projects} />
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
